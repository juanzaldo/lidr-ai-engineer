[project]
name = "estimator-cag"
version = "0.1.0"
description = "API de estimación de software con FastAPI y contexto estático CAG"
readme = "README.md"
authors = [
    { name = "janzaldo", email = "janzaldo@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.156.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "pypdf>=6.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
